[project]
name = "probador-engine"
version = "0.1.0"
description = "Motor del probador virtual: maniquí 3D a partir de medidas y recomendación de talla"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Propietario" }
dependencies = [
    # Modelo de cuerpo. clad-body 0.6.1 usa la parametrización de pose
    # "root_relative_world", que Anny eliminó a partir de la 0.5: no subir
    # Anny sin comprobar antes que los tests del cuerpo siguen pasando.
    "anny==0.3.1",
    "clad-body[anny]==0.6.1",
    "torch>=2.4",
    "numpy>=1.26",
    "scipy>=1.13",
    "trimesh>=4.4",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/probador"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests que cargan el modelo 3D del cuerpo (tardan más de un minuto la primera vez)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
