name: App

on:
  push:
    paths: ["app/**", "data/catalog/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "data/catalog/**", ".github/workflows/app.yml"]

defaults:
  run:
    working-directory: app

jobs:
  comprobar:
    name: Tipos, tests y web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Catálogo al día con data/catalog
        run: |
          npm run catalog
          node scripts/build-seed.mjs
          git diff --exit-code -- src/data/catalog.json ../supabase/seed.sql
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Versión web
        run: npx expo export -p web
