name: Maniquí para el móvil

# Genera app/assets/models/body-model.bin a partir del motor de Python
# (Anny + clad-body). Tarda unos 15 minutos: solo se lanza cuando cambia el
# generador o a mano. Al terminar guarda el binario, los casos de prueba de la
# app y el informe de validación en la misma rama (commit automático).

on:
  push:
    paths:
      - engine/scripts/build_mobile_model.py
      - .github/workflows/body-model.yml
  workflow_dispatch:
    inputs:
      per_shard:
        description: Cuerpos por trozo (hay 2 trozos por base de cuerpo)
        default: "600"

defaults:
  run:
    working-directory: engine

jobs:
  muestras:
    name: Muestras ${{ matrix.sex }} ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        sex: [male, female]
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Caché de datos de Anny
        uses: actions/cache@v4
        with:
          path: ~/.cache/anny
          key: anny-0.3.1-${{ hashFiles('engine/src/probador/body.py') }}
          restore-keys: anny-0.3.1-
      - name: Instalar
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          pip install -e .
      - name: Muestrear
        run: |
          python scripts/build_mobile_model.py sample --sex ${{ matrix.sex }} \
            --shard ${{ matrix.shard }} --n ${{ inputs.per_shard || '600' }} \
            --out muestras-${{ matrix.sex }}-${{ matrix.shard }}.npz
      - uses: actions/upload-artifact@v4
        with:
          name: muestras-${{ matrix.sex }}-${{ matrix.shard }}
          path: engine/muestras-${{ matrix.sex }}-${{ matrix.shard }}.npz
          retention-days: 7

  construir:
    name: Construir y validar
    runs-on: ubuntu-latest
    needs: muestras
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: muestras-*
          path: engine/muestras
          merge-multiple: true
      - name: Instalar
        run: pip install numpy scipy
      - name: Construir
        run: python scripts/build_mobile_model.py build muestras/*.npz
      - name: Guardar en la rama
        if: github.event_name != 'pull_request'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/assets/models/body-model.bin app/src/core/__fixtures__/body-model-cases.json engine/reports/body-model.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Maniquí para el móvil regenerado desde ${GITHUB_SHA::7}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: maniqui
          path: |
            app/assets/models/body-model.bin
            app/src/core/__fixtures__/body-model-cases.json
            engine/reports/body-model.json
          retention-days: 30
