name: Motor

on:
  push:
    branches: [main]
    paths: ["engine/**", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["engine/**", ".github/workflows/engine.yml"]

defaults:
  run:
    working-directory: engine

jobs:
  rapidos:
    name: Tests rápidos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Instalar
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          pip install -e ".[dev]"
      - name: Tests
        run: pytest -m "not slow" -q
      - name: Casos de paridad de la app al día
        run: |
          python scripts/export_golden.py --out /tmp/golden.json
          cmp /tmp/golden.json ../app/src/core/__fixtures__/golden.json || {
            echo "El motor ha cambiado: ejecuta python engine/scripts/export_golden.py y actualiza app/src/core";
            exit 1; }

  maniqui:
    name: Tests del maniquí
    runs-on: ubuntu-latest
    needs: rapidos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Caché de datos de Anny
        uses: actions/cache@v4
        with:
          path: ~/.cache/anny
          key: anny-0.3.1-${{ hashFiles('engine/src/probador/body.py') }}
          restore-keys: anny-0.3.1-
      - name: Instalar
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          pip install -e ".[dev]"
      - name: Tests
        run: pytest -q

  imagen:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: rapidos
    steps:
      - uses: actions/checkout@v4
      - name: Construir
        run: docker build -t probador-engine .
      - name: Arrancar y comprobar
        run: |
          docker run -d --name motor -p 8080:8080 probador-engine
          for i in $(seq 1 60); do
            if curl -fs localhost:8080/health | grep -q '"ready"'; then break; fi
            sleep 2
          done
          curl -fs localhost:8080/health
          curl -fs -X POST localhost:8080/v1/body -H 'Content-Type: application/json' \
            -d '{"sex":"male","measurements":{"height":178,"weight":76,"chest":98,"waist":84,"hip":98,"inseam":81}}' \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['measurements']['chest']==98; print('ok', d['seconds'], 's')"
